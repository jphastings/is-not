name: lenses

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['packages/lenses/**', '.changeset/**', 'lens.go', 'lens_test.go', 'go.mod', '.github/workflows/lenses.yml', '**.go', 'go.sum']
  pull_request:
    paths: ['packages/lenses/**', '.changeset/**', 'lens.go', 'lens_test.go', 'go.mod', '.github/workflows/lenses.yml', '**.go', 'go.sum']

env:
  BINARYEN_VERSION: version_130

jobs:
  test:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/lenses
      - name: Install wasm-opt
        run: |
          curl -fsSL "https://github.com/WebAssembly/binaryen/releases/download/${BINARYEN_VERSION}/binaryen-${BINARYEN_VERSION}-x86_64-linux.tar.gz" | tar xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/binaryen-${BINARYEN_VERSION}/bin" >> "$GITHUB_PATH"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @is-not/lenses build
      - run: pnpm --filter @is-not/lenses test
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
      - uses: actions/upload-artifact@v4
        with:
          name: isnot_lenses.wasm
          path: packages/lenses/dist/isnot_lenses.wasm

  release:
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/lenses
      - name: Install wasm-opt
        run: |
          curl -fsSL "https://github.com/WebAssembly/binaryen/releases/download/${BINARYEN_VERSION}/binaryen-${BINARYEN_VERSION}-x86_64-linux.tar.gz" | tar xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/binaryen-${BINARYEN_VERSION}/bin" >> "$GITHUB_PATH"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @is-not/lenses build
      # Publishes with npm trusted publishing (OIDC via id-token) rather than a
      # token: the publisher for @is-not/lenses on npmjs.com names this repo and
      # this workflow file.
      - id: changesets
        uses: changesets/action@v1
        with:
          publish: pnpm changeset publish
          version: pnpm changeset version
          title: 'chore: version packages'
          commit: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Attach wasm to a GitHub release
        if: steps.changesets.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./packages/lenses/package.json').version")
          gh release create "lenses-v${VERSION}" packages/lenses/dist/isnot_lenses.wasm \
            --title "@is-not/lenses ${VERSION}" \
            --notes "Built from packages/lenses at ${GITHUB_SHA}. Download isnot_lenses.wasm for Go builds via scripts/fetch-lenses.sh."

  # Temporary diagnostic (workflow_dispatch only): performs npm's OIDC token
  # exchange from this workflow file and prints the registry's answer.
  oidc-check:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - run: |
          set -u
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=npm:registry.npmjs.org" | jq -r .value)
          python3 - "$TOKEN" <<'PY'
          import sys, base64, json
          p = sys.argv[1].split('.')[1]
          p += '=' * (-len(p) % 4)
          d = json.loads(base64.urlsafe_b64decode(p))
          print({k: d.get(k) for k in ['sub', 'repository', 'workflow_ref', 'job_workflow_ref', 'environment']})
          PY
          curl -sS -o body.json -w "exchange status: %{http_code}\n" -X POST \
            -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' \
            "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/@is-not%2flenses"
          jq -c 'if type=="object" then del(.token) else . end' body.json 2>/dev/null || cat body.json
