# Temporary diagnostic: performs npm's OIDC token exchange for @is-not/lenses
# and prints the registry's answer. Publishes nothing.
name: oidc-check
on: workflow_dispatch
permissions:
  id-token: write
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set -u
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=npm:registry.npmjs.org" | jq -r .value)
          python3 - "$TOKEN" <<'PY'
          import sys, base64, json
          p = sys.argv[1].split('.')[1]
          p += '=' * (-len(p) % 4)
          d = json.loads(base64.urlsafe_b64decode(p))
          print({k: d.get(k) for k in ['sub', 'repository', 'repository_owner', 'workflow_ref', 'job_workflow_ref', 'environment']})
          PY
          for name in '@is-not%2flenses' '@is-not%2Flenses'; do
            curl -sS -o body.json -w "exchange $name status: %{http_code}\n" -X POST \
              -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' \
              "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/$name"
            jq -c 'if type=="object" then del(.token) else . end' body.json 2>/dev/null || cat body.json
          done
